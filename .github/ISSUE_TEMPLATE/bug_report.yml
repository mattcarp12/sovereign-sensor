name: Bug Report
description: Something isn't working correctly
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill out as much as you can — the environment details are especially important since behavior can differ between Tetragon versions and kernel configurations.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug. What did you expect to happen, and what actually happened?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Minimal steps to reproduce the issue.
      placeholder: |
        1. Apply this SovereigntyPolicy: ...
        2. Run a pod that connects to ...
        3. Observe that ...
    validations:
      required: true

  - type: textarea
    id: policy
    attributes:
      label: SovereigntyPolicy (if relevant)
      description: Paste the relevant `SovereigntyPolicy` manifest. Sensitive values can be redacted.
      render: yaml

  - type: dropdown
    id: component
    attributes:
      label: Which component is affected?
      options:
        - Controller (reconciler / TracingPolicy management)
        - Agent (GeoIP lookup / violation reporting)
        - Frontend (React dashboard)
        - Helm chart
        - CRD / API types
        - Not sure
    validations:
      required: true

  - type: input
    id: sovereign-sensor-version
    attributes:
      label: Sovereign Sensor version
      placeholder: "e.g. v0.2.0 or commit SHA"
    validations:
      required: true

  - type: input
    id: tetragon-version
    attributes:
      label: Tetragon version
      placeholder: "e.g. 1.6.1"
    validations:
      required: true

  - type: input
    id: k8s-version
    attributes:
      label: Kubernetes version
      placeholder: "kubectl version --short"
    validations:
      required: true

  - type: input
    id: kernel-version
    attributes:
      label: Linux kernel version
      placeholder: "uname -r"
    validations:
      required: true

  - type: textarea
    id: controller-logs
    attributes:
      label: Controller logs
      description: "`kubectl logs -n sovereign-sensor-system deploy/sovereign-sensor-controller-manager`"
      render: shell

  - type: textarea
    id: agent-logs
    attributes:
      label: Agent logs
      description: "`kubectl logs -n sovereign-sensor-system ds/sovereign-sensor-agent`"
      render: shell

  - type: textarea
    id: additional
    attributes:
      label: Anything else?
      description: Related issues, workarounds you've tried, or other context.
