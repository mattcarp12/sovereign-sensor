name: Release Sovereign Sensor

# This workflow triggers whenever you push a tag like "v0.1.0"
on:
  push:
    tags:
      - "v*"

jobs:
  build-and-push-images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Needed to push to GHCR

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/sovereign-sensor-controller
            ghcr.io/${{ github.repository_owner }}/sovereign-sensor-agent

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Controller Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/sovereign-sensor-controller:${{ github.ref_name }}

      - name: Build and push Agent Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./agent.Dockerfile # Ensure this matches your agent dockerfile name
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/sovereign-sensor-agent:${{ github.ref_name }}

  release-helm-chart:
    needs: build-and-push-images
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to push Helm charts and docs to gh-pages

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Run Chart Releaser
        uses: helm/chart-releaser-action@v1.6.0
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

      # NEW: Deploy your documentation to the same branch
      - name: Deploy Docs to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          keep_files: true # CRITICAL: This ensures the Helm index.yaml is not deleted!