name: Release Sovereign Sensor

# This workflow triggers whenever you push a tag like "v0.1.0"
on:
  push:
    tags:
      - "v*"

jobs:
  build-and-push-images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Needed to push to GHCR

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Docker Variables
        id: prep
        run: |
          # Strip the 'v' from the git tag (e.g., v0.1.9 becomes 0.1.9)
          VERSION=${GITHUB_REF_NAME#v}
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

          # Force the GitHub username to lowercase
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "owner=${OWNER}" >> $GITHUB_OUTPUT

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Controller Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          # Use our sanitized lowercase owner and version (no 'v')
          tags: ghcr.io/${{ steps.prep.outputs.owner }}/sovereign-sensor-controller:${{ steps.prep.outputs.version }}

      - name: Build and push Agent Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./agent.Dockerfile
          push: true
          # Use our sanitized lowercase owner and version (no 'v')
          tags: ghcr.io/${{ steps.prep.outputs.owner }}/sovereign-sensor-agent:${{ steps.prep.outputs.version }}
  release-helm-chart:
    needs: build-and-push-images
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to push Helm charts and docs to gh-pages

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Run Chart Releaser
        uses: helm/chart-releaser-action@v1.6.0
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

      - name: Deploy Docs to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          keep_files: true
