apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: sovereign-sensor-agent
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: sovereign-sensor
    component: agent
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: sovereign-sensor
      component: agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sovereign-sensor
        component: agent
    spec:
      serviceAccountName: sovereign-sensor-controller-manager
      containers:
      - name: agent
        image: "{{ .Values.agent.image.repository }}:{{ .Values.agent.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: IfNotPresent
        securityContext:
          privileged: true # eBPF agents typically require privileged execution to load BPF programs
        resources:
          limits:
            cpu: {{ .Values.agent.resources.limits.cpu }}
            memory: {{ .Values.agent.resources.limits.memory }}
          requests:
            cpu: {{ .Values.agent.resources.requests.cpu }}
            memory: {{ .Values.agent.resources.requests.memory }}